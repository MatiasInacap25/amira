services:
  - type: web
    name: amira-api-dev
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_NAME
        value: Amira API
      # Demo deployment, not used by real customers: the simulated payment adapter needs a development APP_ENV.
      - key: APP_ENV
        value: development
      - key: PAYMENT_SIMULATOR_SECRET
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://amira-blush.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: INDEPENDENT_DRIVER_TYPE_ID
        sync: false
      - key: COMPANY_DRIVER_TYPE_ID
        sync: false
